name: Deploy ApplyThis

on:
  push:
    branches: [main]

jobs:
  # deploy Express backend
  deploy-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Build backend
        working-directory: backend
        run: npm run build

      # copy dist and package files
      - name: Copy backend build to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          source: "backend/dist/,backend/package.json,backend/package-lock.json"
          target: "/home/ubuntu/apps/applythis-backend"
          rm: true
          strip_components: 1

      - name: Install production deps & restart
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd /home/ubuntu/apps/applythis-backend
            
            # Install only production dependencies
            npm ci --omit=dev
            
            # Restart Express service
            sudo systemctl restart applythis
            
            sleep 5
            sudo systemctl status applythis --no-pager

  # deploy React frontend
  deploy-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build React frontend
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }} 
        run: npm run build

      # copy dist to nginx static files folder
      - name: Copy frontend build to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          source: "frontend/dist/"
          target: "/var/www/applythis"
          rm: true
          strip_components: 2
